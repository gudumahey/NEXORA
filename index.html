<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamp Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background: #0b0b12;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        /* Lamp */
        .lamp {
            position: absolute;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 5;
        }

        .lamp-shade {
            width: 130px;
            height: 75px;
            background: #252532;
            border-radius: 10px 10px 50px 50px;
            margin: auto;
            box-shadow: 0 5px 20px rgba(255, 220, 100, 0.1);
            transition: 0.4s;
        }

        .bulb {
            width: 35px;
            height: 35px;
            background: #555;
            border-radius: 50%;
            margin: -5px auto 0;
            transition: 0.4s;
        }

        /* Light effect */
        .light {
            position: absolute;
            top: 105px;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 350px;
            background: radial-gradient(
                ellipse,
                rgba(255, 220, 100, 0.35),
                transparent 70%
            );
            opacity: 0;
            pointer-events: none;
            transition: 0.5s;
        }

        /* Button */
        .lamp-button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            background: #22222d;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .lamp-button:hover {
            background: #333342;
            transform: scale(1.05);
        }

        /* ON state */
        body.on .bulb {
            background: #ffe36e;
            box-shadow: 0 0 35px #ffe36e;
        }

        body.on .lamp-shade {
            box-shadow: 0 0 30px rgba(255, 220, 100, 0.5);
        }

        body.on .light {
            opacity: 1;
        }

        /* Login box */
        .login-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -40%) scale(0.7);
            width: 330px;
            padding: 30px;
            background: rgba(25, 25, 35, 0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);

            opacity: 0;
            visibility: hidden;
            transition: 0.4s;
            z-index: 10;
        }

        .login-box.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .login-box h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: none;
            outline: none;
            border-radius: 10px;
            background: #15151e;
            color: white;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #ffe36e;
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            box-shadow: 0 0 20px rgba(255, 227, 110, 0.5);
        }
    </style>
</head>

<body>

    <div class="lamp">

        <div class="lamp-shade"></div>
        <div class="bulb"></div>

        <button class="lamp-button" onclick="toggleLamp()">
            💡 Turn On
        </button>

    </div>

    <div class="light"></div>

    <!-- Login -->
    <div class="login-box" id="loginBox">

        <h2>Welcome Back 👋</h2>

        <input type="text" placeholder="Username">

        <input type="password" placeholder="Password">

        <button class="login-btn">
            Login
        </button>

    </div>

    <script>
        function toggleLamp() {

            document.body.classList.toggle("on");

            const loginBox = document.getElementById("loginBox");
            const button = document.querySelector(".lamp-button");

            if (document.body.classList.contains("on")) {

                loginBox.classList.add("show");
                button.innerHTML = "💡 Turn Off";

            } else {

                loginBox.classList.remove("show");
                button.innerHTML = "💡 Turn On";

            }
        }
    </script>

</body>
</html>
