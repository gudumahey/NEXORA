<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOVA CALC</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial, sans-serif;
    background:
        radial-gradient(circle at top left,#302060,transparent 35%),
        radial-gradient(circle at bottom right,#123d58,transparent 35%),
        #07070b;
    color:white;
    padding:20px;
}

.calculator{
    width:390px;
    max-width:100%;
    padding:22px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:30px;
    background:rgba(15,15,23,.82);
    backdrop-filter:blur(25px);
    box-shadow:0 30px 80px rgba(0,0,0,.5);
}

.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.logo{
    font-size:18px;
    font-weight:800;
    letter-spacing:2px;
}

.logo span{
    opacity:.45;
}

.history-btn{
    border:0;
    color:#aaa;
    background:rgba(255,255,255,.06);
    border-radius:10px;
    padding:9px 12px;
    cursor:pointer;
}

.display{
    min-height:145px;
    padding:20px;
    border-radius:22px;
    background:rgba(0,0,0,.28);
    border:1px solid rgba(255,255,255,.06);
    margin-bottom:18px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    text-align:right;
    overflow:hidden;
}

.expression{
    min-height:28px;
    color:#777;
    font-size:16px;
    word-break:break-all;
}

.result{
    margin-top:8px;
    font-size:42px;
    font-weight:700;
    word-break:break-all;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

button{
    height:62px;
    border:0;
    border-radius:17px;
    background:rgba(255,255,255,.07);
    color:white;
    font-size:19px;
    cursor:pointer;
    transition:.15s;
}

button:hover{
    background:rgba(255,255,255,.13);
}

button:active{
    transform:scale(.94);
}

.operator{
    background:rgba(120,80,220,.22);
}

.special{
    color:#aaa;
}

.equals{
    background:linear-gradient(135deg,#7655ff,#407cff);
    font-weight:bold;
}

.zero{
    grid-column:span 2;
}

.history{
    display:none;
    position:absolute;
    width:350px;
    max-width:calc(100% - 40px);
    max-height:400px;
    overflow:auto;
    padding:18px;
    border-radius:20px;
    background:#111119;
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    z-index:10;
}

.history.show{
    display:block;
}

.history h3{
    margin-bottom:15px;
}

.history-item{
    padding:12px 0;
    border-bottom:1px solid rgba(255,255,255,.07);
    color:#aaa;
}

.history-item strong{
    display:block;
    color:white;
    margin-top:5px;
}

.clear-history{
    margin-top:15px;
    width:100%;
    height:45px;
    font-size:14px;
}

@media(max-width:420px){
    .calculator{
        padding:16px;
        border-radius:24px;
    }

    button{
        height:58px;
    }

    .result{
        font-size:36px;
    }
}
</style>
</head>

<body>

<div class="calculator">

    <div class="top">
        <div class="logo">NOVA <span>CALC</span></div>
        <button class="history-btn" onclick="toggleHistory()">⌛</button>
    </div>

    <div class="display">
        <div class="expression" id="expression"></div>
        <div class="result" id="result">0</div>
    </div>

    <div class="buttons">

        <button class="special" onclick="clearAll()">AC</button>
        <button class="special" onclick="backspace()">⌫</button>
        <button class="special" onclick="percent()">%</button>
        <button class="operator" onclick="add('÷')">÷</button>

        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button class="operator" onclick="add('×')">×</button>

        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button class="operator" onclick="add('-')">−</button>

        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button class="operator" onclick="add('+')">+</button>

        <button onclick="add('(')">(</button>
        <button onclick="add(')')">)</button>
        <button onclick="add('.')">.</button>
        <button class="equals" onclick="calculate()">=</button>

        <button class="zero" onclick="add('0')">0</button>
        <button onclick="square()">x²</button>

    </div>
</div>

<div class="history" id="history">
    <h3>Calculation History</h3>
    <div id="historyList">No calculations yet.</div>
    <button class="clear-history" onclick="clearHistory()">Clear History</button>
</div>

<script>

let current = "";
let history = [];

const expression = document.getElementById("expression");
const result = document.getElementById("result");

function update(){
    expression.textContent = current || "";
}

function add(value){

    const operators = ["+","-","×","÷"];

    if(operators.includes(value)){

        if(!current) return;

        if(operators.includes(current.slice(-1))){
            current = current.slice(0,-1) + value;
        }else{
            current += value;
        }

    }else{
        current += value;
    }

    update();
}

function clearAll(){
    current = "";
    result.textContent = "0";
    update();
}

function backspace(){
    current = current.slice(0,-1);
    update();
}

function percent(){

    if(!current) return;

    let match = current.match(/(\d+(\.\d+)?)$/);

    if(match){
        let number = parseFloat(match[0]);
        current = current.slice(0,-match[0].length) + (number / 100);
        update();
    }
}

function square(){

    if(!current) return;

    try{
        let value = evaluate(current);
        current = String(value * value);
        update();
    }catch{
        result.textContent = "Error";
    }
}

function evaluate(input){

    let safe = input
        .replace(/×/g,"*")
        .replace(/÷/g,"/");

    /*
      Allow only calculator characters.
    */
    if(!/^[0-9+\-*/().\s]+$/.test(safe)){
        throw new Error("Invalid");
    }

    let answer = Function('"use strict"; return (' + safe + ')')();

    if(!Number.isFinite(answer)){
        throw new Error("Invalid");
    }

    return answer;
}

function calculate(){

    if(!current) return;

    try{

        let answer = evaluate(current);

        let rounded =
            Math.round((answer + Number.EPSILON) * 100000000) / 100000000;

        result.textContent = rounded;

        history.unshift({
            expression:current,
            result:rounded
        });

        if(history.length > 20){
            history.pop();
        }

        renderHistory();

    }catch{
        result.textContent = "Error";
    }
}

function toggleHistory(){

    document
        .getElementById("history")
        .classList.toggle("show");
}

function renderHistory(){

    const list = document.getElementById("historyList");

    if(history.length === 0){
        list.innerHTML = "No calculations yet.";
        return;
    }

    list.innerHTML = history.map(item => `
        <div class="history-item">
            ${item.expression}
            <strong>= ${item.result}</strong>
        </div>
    `).join("");
}

function clearHistory(){
    history = [];
    renderHistory();
}

/* Keyboard support */

document.addEventListener("keydown",(e)=>{

    if(
        e.key >= "0" &&
        e.key <= "9"
    ){
        add(e.key);
    }

    else if(
        ["+","-","(",")","."].includes(e.key)
    ){
        add(e.key);
    }

    else if(e.key === "*"){
        add("×");
    }

    else if(e.key === "/"){
        e.preventDefault();
        add("÷");
    }

    else if(e.key === "Enter" || e.key === "="){
        calculate();
    }

    else if(e.key === "Backspace"){
        backspace();
    }

    else if(e.key === "Escape"){
        clearAll();
    }

    else if(e.key === "%"){
        percent();
    }

});

</script>

</body>
</html>
